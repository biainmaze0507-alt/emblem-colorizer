<style>
/* layout (Picrew style): preview pinned on top, category tabs under it, swatch grid scrolls below.
   Desktop: preview left, tabs + swatches right. UI is achromatic so only the emblem carries colour. */
:root{
  --bg:#f3f3f3; --panel:#ffffff; --panel2:#ebebeb; --fg:#161616; --muted:#6f6f6f; --line:#d6d6d6;
  --ink:#161616; --ink-fg:#ffffff; --check-a:#c9c9c9; --check-b:#a6a6a6;
  --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:ui-monospace,Consolas,'Courier New',monospace;
  --sv:clamp(110px,20vh,190px);   /* height of the saturation/value panel; drives the fixed control-area height on phones */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141414; --panel:#1e1e1e; --panel2:#2a2a2a; --fg:#ededed; --muted:#9a9a9a; --line:#383838;
    --ink:#ededed; --ink-fg:#141414; --check-a:#3a3a3a; --check-b:#2a2a2a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141414; --panel:#1e1e1e; --panel2:#2a2a2a; --fg:#ededed; --muted:#9a9a9a; --line:#383838;
  --ink:#ededed; --ink-fg:#141414; --check-a:#3a3a3a; --check-b:#2a2a2a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 0}
.titlebar{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.02em}
.titlebar span{font-size:12px;color:var(--muted)}
.preview{position:relative;width:min(100%,42vh,520px);aspect-ratio:1;max-width:100%;margin:0 auto;border-radius:8px;overflow:hidden;background:var(--panel2)}
.preview.checker{background-color:var(--check-a);background-image:
  linear-gradient(45deg,var(--check-b) 25%,transparent 25%),linear-gradient(-45deg,var(--check-b) 25%,transparent 25%),
  linear-gradient(45deg,transparent 75%,var(--check-b) 75%),linear-gradient(-45deg,transparent 75%,var(--check-b) 75%);
  background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.preview canvas{display:block;width:100%;height:100%;max-width:100%}
.preview .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);background:var(--panel2);font-size:13px}
.tabs{display:flex;gap:0;margin-top:6px;padding-bottom:0}
.tab{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 8px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);font:inherit;font-size:11px;letter-spacing:-.03em;cursor:pointer;white-space:nowrap}
@media (min-width:480px){.tab{font-size:12px;letter-spacing:0}}
.tab .dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;font-size:12px;color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--ink);font-weight:700}
.tab[disabled]{opacity:.4;cursor:default}
.content{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;min-width:0}
@media (max-width:899px){
  /* phone: the control area has a fixed height so preview + tabs + controls fit one screen; long panes scroll inside it */
  .content{flex:none;height:calc(var(--sv) + 160px);overflow-y:auto;padding-block:12px 12px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .custom .hint{display:none}
  .pane h2{margin-bottom:8px}
}
.pane[hidden]{display:none!important}
.pane h2{font-size:13px;font-weight:700;margin:0 0 10px;color:var(--fg)}
.pane h2 small{font-weight:400;color:var(--muted);margin-left:6px}
.picker{max-width:640px}
.sv{position:relative;width:100%;height:var(--sv);border-radius:8px;border:1px solid var(--line);touch-action:none;cursor:crosshair;user-select:none}
.sv .handle{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 1px 4px rgba(0,0,0,.4);pointer-events:none}
.hue{position:relative;width:100%;height:28px;margin-top:14px;border-radius:14px;border:1px solid var(--line);touch-action:none;cursor:pointer;user-select:none;
  background:linear-gradient(to right,#f00 0%,#ff0 17%,#0f0 33%,#0ff 50%,#00f 67%,#f0f 83%,#f00 100%)}
.hue .hhandle{position:absolute;top:50%;width:14px;height:36px;margin:-18px 0 0 -7px;border-radius:7px;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 1px 4px rgba(0,0,0,.4);pointer-events:none}
.custom{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.custom .cur{width:44px;height:36px;border:1px solid var(--line);border-radius:8px}
.custom .cur.dim{opacity:.35}
.tchip{width:56px;height:36px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:12px;font-weight:700;color:#111;cursor:pointer;
  background-color:#d9d9d9;background-image:linear-gradient(45deg,#a8a8a8 25%,transparent 25%),linear-gradient(-45deg,#a8a8a8 25%,transparent 25%),
  linear-gradient(45deg,transparent 75%,#a8a8a8 75%),linear-gradient(-45deg,transparent 75%,#a8a8a8 75%);background-size:10px 10px;background-position:0 0,0 5px,5px -5px,-5px 0;
  text-shadow:0 0 3px #fff,0 0 3px #fff}
.tchip[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.tab .dot.tdot{background-color:#d9d9d9!important;background-image:linear-gradient(45deg,#a8a8a8 25%,transparent 25%),linear-gradient(-45deg,#a8a8a8 25%,transparent 25%),
  linear-gradient(45deg,transparent 75%,#a8a8a8 75%),linear-gradient(-45deg,transparent 75%,#a8a8a8 75%);background-size:8px 8px;background-position:0 0,0 4px,4px -4px,-4px 0}
.hex{width:104px;font-family:var(--mono);font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);text-transform:uppercase}
.hex.bad{border-color:var(--fg);border-style:dashed}
.opt{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);max-width:640px}
.opt label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.opt .lead{color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;max-width:640px}
.seg button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 6px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);font:inherit;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink);font-weight:700}
.seg canvas.crown{width:52px;height:30px;flex:none}
.vgroup + .vgroup{margin-top:12px}
.tin{display:block;width:100%;max-width:640px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);font:inherit;font-size:16px}
.tin::placeholder{color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button.b{padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);font:inherit;font-weight:500;cursor:pointer}
button.b.primary{background:var(--ink);color:var(--ink-fg);border-color:var(--ink);font-weight:700}
button.b:disabled{opacity:.5;cursor:default}
select,input[type=text]{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}
.block{max-width:640px}
.block + .block{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.code{display:flex;gap:8px;margin-top:8px}
.code input{flex:1;min-width:0;font-family:var(--mono);font-size:12px}
.msg{min-height:1.4em;margin-top:8px;color:var(--muted);font-size:13px}
.hint{color:var(--muted);font-size:12px;margin:8px 0 0}
.saved{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.saved figure{margin:0;position:relative;width:96px}
.saved img{display:block;width:96px;height:96px;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:var(--panel2)}
.saved img.cur{outline:3px solid var(--ink);outline-offset:2px}
.saved figcaption{font-size:11px;color:var(--muted);text-align:center;margin-top:4px;font-family:var(--mono)}
.saved .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (min-width:900px){
  :root{--sv:clamp(140px,30vh,240px)}
  .app{display:grid;grid-template-columns:minmax(0,1fr) 460px;grid-template-rows:auto auto 1fr;max-width:1180px;margin:0 auto;gap:0 28px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 16px}
  .top{position:static;border:0;padding:0;background:transparent;display:contents}
  .titlebar{grid-column:1/-1;margin-bottom:14px}
  .preview{grid-column:1;grid-row:2/4;width:min(100%,620px);position:sticky;top:16px;align-self:start}
  .tabs{grid-column:2;grid-row:2;margin:0;border-bottom:1px solid var(--line)}
  .content{grid-column:2;grid-row:3;padding:0;margin-top:16px}
}
</style>

<div class="app">
  <div class="top">
    <div class="titlebar"><h1>마비팟 엠블럼 놀이터</h1></div>
    <div class="preview" id="previewBox">
      <canvas id="preview" width="1000" height="1000" aria-label="엠블럼 미리보기"></canvas>
      <div class="loading" id="loading">불러오는 중…</div>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="편집 항목"></div>
  </div>
  <div class="content" id="content"></div>
</div>

<script>
const META = {
  ribbon: ['bg','line','gold','cream','gem_top','gem_left','gem_mid','gem_right','wings','ribbon'],
};
const FULL = 2475, PREV = 1000;
/* ribbon lettering (ErinLang font, typed live): 24pt in the deck = 110px at 2475px; glyph centres follow the ribbon's shallow sag */
const TEXT = {size: 110, cx: 1233, cy: 2004, R: 4118, maxW: 1150, family: 'ErinLang'};
const fontReady = (document.fonts && document.fonts.load) ? document.fonts.load('110px ' + TEXT.family).catch(() => {}) : Promise.resolve();
const GROUPS = [
  ['metal',  '금속',      '',   '#E0C7A9'],
  ['outer',  '날개 바깥', '',   '#DE80A6'],
  ['inner',  '날개 안쪽', '',                              '#F4EEE8'],
  ['ribbon', '리본',      '',   '#DE80A6'],
  ['bg',     '배경',      '',   '#222A39'],
  ['text',   '글씨',      '',   '#FFFFFF'],
];
const DEFAULTS = Object.fromEntries(GROUPS.map(g => [g[0], g[3]]));
const DEFAULT_TEXT = '마비팟';

/* colour maths */
function hexToHsv(hex){
  const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d > 0){
    if (max === r) h = ((g - b) / d) % 6; else if (max === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return {h, s: max ? d / max : 0, v: max};
}
function hsvToHex(h, s, v){
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  let r, g, b;
  if (h < 60) [r, g, b] = [c, x, 0]; else if (h < 120) [r, g, b] = [x, c, 0]; else if (h < 180) [r, g, b] = [0, c, x];
  else if (h < 240) [r, g, b] = [0, x, c]; else if (h < 300) [r, g, b] = [x, 0, c]; else [r, g, b] = [c, 0, x];
  return '#' + [r, g, b].map(n => Math.round((n + m) * 255).toString(16).padStart(2, '0')).join('').toUpperCase();
}

const state = {version:'ribbon', text:DEFAULT_TEXT, colors:{...DEFAULTS}, midGem:'mid', transparent:false, frame:false, tab:'version'};
/* rounded-square frame from slide 2 of the deck, as fractions of the canvas side; emb = where the emblem sits inside it */
const FRAME = {inset: 24.5 / 540, size: 490.9 / 540, lw: 6 / 540, r: 0.29065 * 490.9 / 540, emb: {x: 52.2 / 540, y: 52.2 / 540, s: 435.7 / 540},
  // thin inner line, proportioned like the shield's outer/inner strokes (about 4.4 : 1, a clear gap of roughly one outer width)
  inner: {inset: 34.2 / 540, size: (540 - 2 * 34.2) / 540, lw: 1.4 / 540, r: (0.29065 * 490.9 - 9.7) / 540}};

function groupOf(layer){
  switch(layer){
    case 'gold': return 'metal';
    case 'cream': return 'inner';
    case 'wings': case 'gem_left': case 'gem_right': return 'outer';
    case 'gem_mid': return state.midGem === 'mid' ? 'ribbon' : 'outer';
    case 'gem_top': return state.midGem === 'top' ? 'ribbon' : 'outer';
    case 'ribbon': return 'ribbon';
    case 'text': return 'text';
    default: return 'bg';            // bg and line: the outline areas are empty space, so they read as background
  }
}

/* ---------- mask loading ---------- */
const maskSrc = (tag, name) => (window.EMBEDDED_MASKS && window.EMBEDDED_MASKS[tag + '_' + name]) || ('masks/' + tag + '_' + name + '.png');
const versions = {};
function loadImage(src){
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error(src)); im.src = src; });
}
async function loadVersion(tag){
  if (versions[tag]) return versions[tag];
  const full = {}, prev = {};
  await Promise.all(META[tag].map(async name => {
    const im = await loadImage(maskSrc(tag, name));
    full[name] = im;
    const c = document.createElement('canvas'); c.width = c.height = PREV;
    const cx = c.getContext('2d'); cx.imageSmoothingQuality = 'high'; cx.drawImage(im, 0, 0, PREV, PREV);
    prev[name] = c;
  }));
  versions[tag] = {full, prev};
  return versions[tag];
}

/* ---------- compositing: each pixel = sum over layers of colour × coverage ---------- */
const scratchByW = {};
function scratch(w){ if (!scratchByW[w]) { const c = document.createElement('canvas'); c.width = c.height = w; scratchByW[w] = c; } return scratchByW[w]; }
function composite(target, masks, w){
  const t = target.getContext('2d');
  t.globalCompositeOperation = 'source-over'; t.clearRect(0, 0, w, w);
  const s = scratch(w).getContext('2d');
  for (const name of META[state.version]){
    if (state.transparent && (name === 'bg' || name === 'line')) continue;   // transparent: background and navy outlines both become empty space
    s.globalCompositeOperation = 'source-over'; s.clearRect(0, 0, w, w);
    s.fillStyle = state.colors[groupOf(name)]; s.fillRect(0, 0, w, w);
    s.globalCompositeOperation = 'destination-in'; s.drawImage(masks[name], 0, 0, w, w);
    t.globalCompositeOperation = 'lighter'; t.drawImage(scratch(w), 0, 0);
  }
  t.globalCompositeOperation = 'source-over';
  drawText(t, w);
}
/* lettering along the ribbon: each character sits on a very large circle (centre far above), rotated to the tangent */
function drawText(ctx, w){
  const text = (state.text || '').trim(); if (!text) return;
  const k = w / FULL; let size = TEXT.size * k;
  ctx.save(); ctx.fillStyle = state.colors.text; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = size + 'px ' + TEXT.family;
  let total = ctx.measureText(text).width;
  if (total > TEXT.maxW * k) { size *= TEXT.maxW * k / total; ctx.font = size + 'px ' + TEXT.family; total = ctx.measureText(text).width; }
  const R = TEXT.R * k, cx = TEXT.cx * k, cy = (TEXT.cy - TEXT.R) * k;
  let pos = -total / 2;
  for (const ch of Array.from(text)){
    const cw = ctx.measureText(ch).width, th = (pos + cw / 2) / R;
    ctx.save(); ctx.translate(cx + R * Math.sin(th), cy + R * Math.cos(th)); ctx.rotate(-th); ctx.fillText(ch, 0, 0); ctx.restore();
    pos += cw;
  }
  ctx.restore();
}
const scratch2ByW = {};
function scratch2(w){ if (!scratch2ByW[w]) { const c = document.createElement('canvas'); c.width = c.height = w; scratch2ByW[w] = c; } return scratch2ByW[w]; }
/* full scene: the emblem alone, or the emblem scaled into the rounded frame */
function renderScene(target, masks, w){
  if (!state.frame) { composite(target, masks, w); return; }
  const emb = scratch2(w); composite(emb, masks, w);
  const t = target.getContext('2d'); t.globalCompositeOperation = 'source-over'; t.clearRect(0, 0, w, w);
  if (!state.transparent) { t.fillStyle = state.colors.bg; t.fillRect(0, 0, w, w); }
  t.imageSmoothingQuality = 'high';
  t.drawImage(emb, 0, 0, w, w, FRAME.emb.x * w, FRAME.emb.y * w, FRAME.emb.s * w, FRAME.emb.s * w);
  t.strokeStyle = state.colors.metal;
  for (const f of [FRAME, FRAME.inner]){
    const i = f.inset * w, s = f.size * w, r = f.r * w;
    t.beginPath(); t.roundRect(i, i, s, s, r); t.lineWidth = f.lw * w; t.stroke();
  }
}

const preview = document.getElementById('preview');
let renderQueued = false;
function render(){
  if (renderQueued) return; renderQueued = true;
  requestAnimationFrame(async () => {
    renderQueued = false;
    const loading = document.getElementById('loading');
    await fontReady;
    if (!versions[state.version]) {
      loading.hidden = false;
      try { await loadVersion(state.version); }
      catch (e) { loading.textContent = '이미지를 불러오지 못했습니다 (' + e.message + ')'; return; }
    }
    renderScene(preview, versions[state.version].prev, PREV);
    loading.hidden = true;
    document.getElementById('previewBox').classList.toggle('checker', state.transparent);
    syncUI();
  });
}

/* ---------- state code: version.metal.outer.inner.ribbon.bg.text.gem[.t][.f]  (older codes may carry an extra .line colour, ignored) ---------- */
function encode(){
  const c = state.colors;
  return [state.version, c.metal, c.outer, c.inner, c.ribbon, c.bg, c.text].map(x => x.replace('#', '')).join('.')
    + '.' + state.midGem + (state.transparent ? '.t' : '') + (state.frame ? '.f' : '');
}
function decode(str){
  const p = String(str || '').trim().replace(/^#/, '').split('.');
  if (!/^(plain|ribbon|text)$/.test(p[0]) || p.length < 7) return null;
  p[0] = 'ribbon';                                   // older codes named a version; the ribbon is now always drawn
  const isHex = h => /^[0-9a-fA-F]{6}$/.test(h);
  const n = isHex(p[7] || '') ? 7 : 6;
  const hex = p.slice(1, 1 + n); if (!hex.every(isHex)) return null;
  const [metal, outer, inner, ribbon, bg, text] = hex.map(h => '#' + h.toUpperCase());
  return {version:p[0], colors:{metal, outer, inner, ribbon, bg, text},
    midGem: p[1 + n] === 'top' ? 'top' : 'mid', transparent: p.slice(1 + n).includes('t'), frame: p.slice(1 + n).includes('f')};
}
function apply(s){ Object.assign(state, {version:'ribbon', colors:{...s.colors}, midGem:s.midGem, transparent:s.transparent, frame:!!s.frame}); if (typeof s.text === 'string') state.text = s.text; render(); }

/* ---------- tabs ---------- */
const TAB_LABEL = {outer:'날개밖', inner:'날개안'};   // shorter tab labels so all tabs fit one row on a phone
const TABS = [['version', '구성'], ...GROUPS.map(g => [g[0], TAB_LABEL[g[0]] || g[1]]), ['export', '저장']];
const tabsEl = document.getElementById('tabs'), contentEl = document.getElementById('content');
for (const [id, label] of TABS){
  const b = document.createElement('button'); b.className = 'tab'; b.type = 'button'; b.role = 'tab'; b.id = 'tab-' + id; b.dataset.tab = id;
  const dot = id === 'version' ? '◧' : id === 'export' ? '↓' : '';
  b.innerHTML = `<span class="dot" id="dot-${id}">${dot}</span><span>${label}</span>`;
  b.addEventListener('click', () => { if (b.disabled) return; state.tab = id; syncUI(); });
  tabsEl.appendChild(b);
}

/* version pane */
const vPane = document.createElement('section'); vPane.className = 'pane'; vPane.id = 'pane-version';
vPane.innerHTML = `
  <div class="vgroup"><h2>글씨</h2>
    <input type="text" class="tin" id="textIn" maxlength="16" autocomplete="off" spellcheck="false" placeholder="리본에 들어갈 글씨" aria-label="리본 글씨"></div>
  <div class="vgroup"><h2>왕관 가운데 보석 위치<small>리본 색과 통일</small></h2><div class="seg" id="gemSeg">
    <button type="button" data-g="mid"><canvas class="crown" width="104" height="60" data-g="mid"></canvas>띠 가운데</button>
    <button type="button" data-g="top"><canvas class="crown" width="104" height="60" data-g="top"></canvas>꼭대기</button></div></div>
  <div class="vgroup"><h2>프레임</h2><div class="seg" id="frameSeg">
    <button type="button" data-f="1">켜기</button><button type="button" data-f="0">끄기</button></div></div>`;
contentEl.appendChild(vPane);
const textIn = vPane.querySelector('#textIn');
textIn.addEventListener('input', () => { state.text = textIn.value; try { localStorage.setItem('emblem-text', state.text); } catch (e) {} render(); });
vPane.querySelector('#gemSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { state.midGem = b.dataset.g; render(); } });
vPane.querySelector('#frameSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { state.frame = b.dataset.f === '1'; render(); } });

/* small crown icons: the gem that follows the ribbon colour is highlighted */
const CROWN = {x: 1030, y: 625, w: 410, h: 265};           // crown bounding box in 2475px source coordinates
function drawCrownIcons(){
  const v = versions[state.version]; if (!v) return;
  const sx = CROWN.x * PREV / FULL, sy = CROWN.y * PREV / FULL, sw = CROWN.w * PREV / FULL, shh = CROWN.h * PREV / FULL;
  document.querySelectorAll('canvas.crown').forEach(c => {
    const hi = c.dataset.g, ctx = c.getContext('2d'), W = c.width, H = c.height;
    const scale = Math.min(W / sw, H / shh), dw = sw * scale, dh = shh * scale, dx = (W - dw) / 2, dy = (H - dh) / 2;
    ctx.clearRect(0, 0, W, H);
    const s = scratch(PREV).getContext('2d');
    const pressed = c.closest('button').getAttribute('aria-pressed') === 'true';
    const paint = (name, color) => {
      s.globalCompositeOperation = 'source-over'; s.clearRect(sx, sy, sw, shh); s.fillStyle = color; s.fillRect(sx, sy, sw, shh);
      s.globalCompositeOperation = 'destination-in'; s.drawImage(v.prev[name], 0, 0);
      ctx.drawImage(scratch(PREV), sx, sy, sw, shh, dx, dy, dw, dh);
    };
    const base = pressed ? 'rgba(255,255,255,.85)' : 'rgba(128,128,128,.55)';
    paint('gold', base);                               // outline layer left out: its area stays empty, as in the transparent export
    for (const g of ['gem_top', 'gem_left', 'gem_mid', 'gem_right']){
      const isHi = (hi === 'mid' && g === 'gem_mid') || (hi === 'top' && g === 'gem_top');
      paint(g, isHi ? state.colors.ribbon : base);
    }
  });
}

/* one shared picker, moved into whichever colour pane is open */
const pickerEl = document.createElement('div'); pickerEl.className = 'picker';
pickerEl.innerHTML = `
  <div class="sv" id="sv" aria-label="채도·명도 선택"><div class="handle" id="svH"></div></div>
  <div class="hue" id="hue" aria-label="색상 선택"><div class="hhandle" id="hueH"></div></div>
  <div class="custom"><span class="cur" id="cur"></span>
    <input type="text" class="hex" id="hex" maxlength="7" spellcheck="false" aria-label="16진수 색 코드">
    <button type="button" class="tchip" id="tchip" title="배경 투명" aria-pressed="false" hidden>투명</button>
    </div>`;
const picker = {key: null, h: 0, s: 0, v: 0};
const svEl = pickerEl.querySelector('#sv'), svH = pickerEl.querySelector('#svH'), hueEl = pickerEl.querySelector('#hue'), hueH = pickerEl.querySelector('#hueH');
const hexEl = pickerEl.querySelector('#hex'), curEl = pickerEl.querySelector('#cur'), tchip = pickerEl.querySelector('#tchip');
tchip.addEventListener('click', () => { state.transparent = !state.transparent; render(); });
function openPicker(key){
  const hex = state.colors[key];
  if (picker.key !== key || hsvToHex(picker.h, picker.s, picker.v) !== hex) Object.assign(picker, hexToHsv(hex));
  picker.key = key;
  const slot = document.getElementById('slot-' + key);
  if (pickerEl.parentNode !== slot) slot.appendChild(pickerEl);
  drawPicker();
}
function drawPicker(){
  const hueHex = hsvToHex(picker.h, 1, 1);
  svEl.style.background = `linear-gradient(to top,#000,rgba(0,0,0,0)),linear-gradient(to right,#fff,${hueHex})`;
  svH.style.left = (picker.s * 100) + '%'; svH.style.top = ((1 - picker.v) * 100) + '%';
  svH.style.background = state.colors[picker.key];
  hueH.style.left = (picker.h / 360 * 100) + '%'; hueH.style.background = hueHex;
  curEl.style.background = state.colors[picker.key];
  if (document.activeElement !== hexEl) hexEl.value = state.colors[picker.key];
  tchip.hidden = picker.key !== 'bg';
  tchip.setAttribute('aria-pressed', String(picker.key === 'bg' && state.transparent));
  curEl.classList.toggle('dim', picker.key === 'bg' && state.transparent);
}
function drag(el, onPoint){
  const handle = e => {
    const r = el.getBoundingClientRect();
    onPoint(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)));
  };
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); handle(e); });
  el.addEventListener('pointermove', e => { if (e.buttons & 1) handle(e); });
}
drag(svEl, (x, y) => { picker.s = x; picker.v = 1 - y; setColor(picker.key, hsvToHex(picker.h, picker.s, picker.v)); });
drag(hueEl, x => { picker.h = Math.min(359.999, x * 360); setColor(picker.key, hsvToHex(picker.h, picker.s, picker.v)); });
hexEl.addEventListener('input', e => {
  let v = e.target.value.trim(); if (v && v[0] !== '#') v = '#' + v;
  if (/^#[0-9a-fA-F]{6}$/.test(v)) { hexEl.classList.remove('bad'); setColor(picker.key, v); } else hexEl.classList.add('bad');
});
hexEl.addEventListener('blur', () => { hexEl.value = state.colors[picker.key]; hexEl.classList.remove('bad'); });

/* colour panes */
for (const [key, label, note] of GROUPS){
  const pane = document.createElement('section'); pane.className = 'pane'; pane.id = 'pane-' + key;
  pane.innerHTML = `<h2>${label}${note ? `<small>${note}</small>` : ''}</h2><div id="slot-${key}"></div>`;
  contentEl.appendChild(pane);
}
function setColor(key, v){ state.colors[key] = v.toUpperCase(); if (key === 'bg') state.transparent = false; render(); }

/* export pane */
const xPane = document.createElement('section'); xPane.className = 'pane'; xPane.id = 'pane-export';
xPane.innerHTML = `
  <div class="block"><h2>PNG 저장</h2>
    <div class="btns">
      <select id="size" aria-label="저장 크기"><option value="2475">2475px (원본)</option><option value="1024">1024px</option><option value="512">512px</option><option value="256">256px</option></select>
      <button class="b primary" type="button" id="download">PNG 저장</button>
    </div><div class="msg" id="dlMsg"></div></div>
  <div class="block"><h2>시안 보관</h2>
    <div class="btns"><button class="b" type="button" id="save">현재 시안 저장</button></div>
    <div class="saved" id="saved" aria-label="저장한 시안"></div></div>`;
contentEl.appendChild(xPane);

function syncUI(){
  const code = encode();
  for (const [key] of GROUPS){
    const dot = document.getElementById('dot-' + key); dot.style.background = state.colors[key]; dot.textContent = '';
  }
  const textTab = document.getElementById('tab-text'); textTab.disabled = !(state.text || '').trim();
  if (textTab.disabled && state.tab === 'text') state.tab = 'ribbon';
  if (document.activeElement !== textIn && textIn.value !== state.text) textIn.value = state.text;
  if (DEFAULTS[state.tab] !== undefined) openPicker(state.tab);
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === state.tab)));
  document.querySelectorAll('.pane').forEach(p => p.hidden = p.id !== 'pane-' + state.tab);
  document.querySelectorAll('#gemSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.g === state.midGem)));
  document.querySelectorAll('#frameSeg button').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.f === '1') === state.frame)));
  drawCrownIcons();
  const bgDot = document.getElementById('dot-bg'); bgDot.classList.toggle('tdot', state.transparent); if (state.transparent) bgDot.style.background = '';
  document.querySelectorAll('#saved img').forEach(im => im.classList.toggle('cur', im.dataset.code === code));
  try { localStorage.setItem('emblem-current', code); } catch (e) {}
}

/* ---------- saved variants ---------- */
function readSaved(){ try { return JSON.parse(localStorage.getItem('emblem-variants') || '[]'); } catch (e) { return []; } }
function writeSaved(list){ try { localStorage.setItem('emblem-variants', JSON.stringify(list)); } catch (e) {} }
function renderSaved(){
  const box = document.getElementById('saved'); box.innerHTML = '';
  readSaved().forEach((it, i) => {
    const f = document.createElement('figure');
    f.innerHTML = `<img alt="저장한 시안 ${i + 1}" title="불러오기"><button class="x" type="button" aria-label="삭제">×</button><figcaption></figcaption>`;
    const im = f.querySelector('img'); im.src = it.thumb; im.dataset.code = it.code;
    f.querySelector('figcaption').textContent = (it.text || '').trim() || '글씨 없음';
    im.addEventListener('click', () => { const s = decode(it.code); if (s) { s.text = typeof it.text === 'string' ? it.text : state.text; apply(s); } });
    f.querySelector('.x').addEventListener('click', () => { const l = readSaved(); l.splice(i, 1); writeSaved(l); renderSaved(); });
    box.appendChild(f);
  });
  syncUI();
}
document.getElementById('save').addEventListener('click', () => {
  const c = document.createElement('canvas'); c.width = c.height = 192;
  const cx = c.getContext('2d'); cx.imageSmoothingQuality = 'high'; cx.drawImage(preview, 0, 0, 192, 192);
  const list = readSaved().filter(it => !(it.code === encode() && (it.text || '') === state.text));
  list.push({code: encode(), text: state.text, thumb: c.toDataURL('image/png')});
  writeSaved(list); renderSaved();
});

/* ---------- PNG export ---------- */
const dlBtn = document.getElementById('download'), dlMsg = document.getElementById('dlMsg');
const inArtifact = !!(window.claude && typeof window.claude.use === 'function');
const downloadsNs = inArtifact ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
function downscale(src, size){
  let cur = src, w = src.width;
  while (w / 2 >= size){
    const c = document.createElement('canvas'); w = Math.round(w / 2); c.width = c.height = w;
    const cx = c.getContext('2d'); cx.imageSmoothingQuality = 'high'; cx.drawImage(cur, 0, 0, w, w); cur = c;
  }
  if (w === size) return cur;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const cx = c.getContext('2d'); cx.imageSmoothingQuality = 'high'; cx.drawImage(cur, 0, 0, size, size); return c;
}
dlBtn.addEventListener('click', async () => {
  dlBtn.disabled = true; dlMsg.textContent = '그리는 중…';
  try {
    const v = await loadVersion(state.version);
    const full = document.createElement('canvas'); full.width = full.height = FULL;
    renderScene(full, v.full, FULL);
    const size = +document.getElementById('size').value;
    const out = size === FULL ? full : downscale(full, size);
    const blob = await new Promise(r => out.toBlob(r, 'image/png'));
    const filename = 'emblem' + (state.frame ? '-frame' : '') + (state.transparent ? '-transparent' : '') + '-' + size + 'px.png';
    const dl = await downloadsNs;
    if (dl){
      try {
        const buf = await blob.arrayBuffer();
        await dl.save({filename, data: buf});
        dlMsg.textContent = '저장했습니다: ' + filename;
      } catch (e) {
        dlMsg.textContent = e && e.code === 'declined' ? '저장을 취소했습니다.'
          : '저장이 거부되었습니다 (' + ((e && (e.code + ': ' + e.message)) || '오류') + '). HTML 파일이나 GitHub Pages 주소에서는 바로 저장됩니다.';
      }
    } else if (inArtifact){
      dlMsg.textContent = '이 화면에서는 파일 저장이 막혀 있습니다. GitHub Pages 주소나 HTML 파일로 열어서 저장하세요.';
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      dlMsg.textContent = '저장했습니다: ' + filename;
    }
  } catch (e) { dlMsg.textContent = '저장에 실패했습니다: ' + e.message; }
  dlBtn.disabled = false;
});

/* ---------- size the preview to the height left over, so the page never scrolls ---------- */
const previewBox = document.getElementById('previewBox');
function fitPreview(){
  const top = document.querySelector('.top'), title = document.querySelector('.titlebar');
  const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  if (window.matchMedia('(min-width:900px)').matches){
    // desktop: preview fills the left column up to the window height; the right-hand pane scrolls inside itself
    const app = document.querySelector('.app'), cs = getComputedStyle(app);
    const colW = parseFloat(cs.gridTemplateColumns) || previewBox.parentElement.clientWidth;
    const used = parseFloat(cs.paddingTop) + title.offsetHeight + parseFloat(getComputedStyle(title).marginBottom) + parseFloat(cs.paddingBottom);
    const size = Math.floor(Math.max(240, Math.min(colW, 620, vh - used)));
    previewBox.style.width = size + 'px'; previewBox.style.height = size + 'px';
    contentEl.style.maxHeight = Math.max(160, Math.floor(vh - used - tabsEl.offsetHeight - 17)) + 'px';
    contentEl.style.overflowY = 'auto';
    return;
  }
  contentEl.style.maxHeight = ''; contentEl.style.overflowY = '';
  const cs = getComputedStyle(top);
  const availW = top.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const used = parseFloat(cs.paddingTop) + title.offsetHeight + parseFloat(getComputedStyle(title).marginBottom)
    + tabsEl.offsetHeight + parseFloat(getComputedStyle(tabsEl).marginTop) + 1 /* border */ + contentEl.offsetHeight;
  const size = Math.floor(Math.max(140, Math.min(availW, vh - used)));
  previewBox.style.width = size + 'px'; previewBox.style.height = size + 'px';
}
window.addEventListener('resize', fitPreview);
if (window.visualViewport) window.visualViewport.addEventListener('resize', fitPreview);
if (window.ResizeObserver){ const ro = new ResizeObserver(fitPreview); ro.observe(tabsEl); ro.observe(contentEl); ro.observe(document.querySelector('.titlebar')); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitPreview);

/* ---------- start ---------- */
(function init(){
  fitPreview();
  let s = decode(location.hash.slice(1));
  if (!s) { try { s = decode(localStorage.getItem('emblem-current')); } catch (e) {} }
  if (s) Object.assign(state, {version:'ribbon', colors:{...s.colors}, midGem:s.midGem, transparent:s.transparent, frame:!!s.frame});
  try { const t = localStorage.getItem('emblem-text'); if (t !== null) state.text = t; } catch (e) {}
  renderSaved();
  render();
})();
</script>
